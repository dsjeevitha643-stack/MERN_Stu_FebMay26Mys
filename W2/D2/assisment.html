<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification center UI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">
    
    <div class="bg-white p-8 m-6 rounded-2xl shadow-xl w-full max-w-lg border border-gray-100">
        
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold leading-relaxed tracking-wide text-slate-800">
                Notification Center
            </h2>
            <span class="inline-flex items-center bg-blue-100 text-blue-700 px-4 py-1 rounded-full text-sm font-bold">
                3 New
            </span>
        </div>

        <div class="flex flex-col gap-4 mb-8">
            
            <div class="bg-red-100  border-red-500 p-4">
                <h4 class="font-bold text-red-800 text-lg">Action Required</h4>
                <p class="text-red-700 text-sm">
                    Your last payment attempt failed. Please update your payment method to avoid service interruption.
                </p>
            </div>

            <div class="bg-yellow-200 border-yellow-400 p-4">
                <h4 class="font-bold text-yellow-800 text-lg">Maintenance Notice</h4>
                <p class="text-yellow-700 text-sm">
                    The system will undergo maintenance tonight. Some features may be temporarily unavailable.
                </p>
            </div>
            
        </div>

        <div class="flex items-center gap-3">
            <button class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg shadow font-bold transition-colors  focus:ring-2 focus:ring-blue-500">
                View All
            </button>
            
            <button class="border border-gray-300 text-slate-700 px-6 py-3 rounded-lg hover:bg-gray-50 font-bold transition-colors  focus:ring-2 focus:ring-blue-500">
                Dismiss
            </button>
        </div>

    </div>

</body>
</html>
