<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
    <style>
        .canvas {
            padding: 50px;
            display: flex;
            justify-content: center;
        }
        .roof {
            position: relative;
            width: 400px;
            height: 50px;
            background-color: orange; 
            border: 6px solid black;
            z-index: 2;
        }
        .base {
            position: relative;
            width: 240px;
            height: 300px;
            background-color: greenyellow; 
            border: 6px solid black;
            left: 80px;  
            top: -6px;   
        } 

        .window-yellow {
            position: relative;
            width: 45px;
            height: 80px;
            background-color: yellow; /* Yellow */
            border: 5px solid black;
            top: 30px;
            left: 35px;
        }
        .window-purple {
            position: relative;
            width: 40px;
            height: 70px;
            background-color: #a349a4; /* Purple */
            border: 5px solid #000;
            top: -55px; 
            left: 155px;
        }
        .door {
            position: relative;
            width: 65px;
            height: 120px;
            background-color: blue; 
            border: 5px solid black;
            top: -20px;
            left: 85px;
        }
    </style>
</head>
<body>

    <div class="canvas">
        <div class="house-structure">
            <div class="roof"></div>
            
            <div class="base">
                <div class="window-yellow"></div>
                <div class="window-purple"></div>
                <div class="door"></div>
            </div>
        </div>
    </div>

</body>
</html>
