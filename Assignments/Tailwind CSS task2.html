<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metric Snapshot strip</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 p-12 font-sans">

    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 max-w-6xl mx-auto">
        
        <div class="flex justify-between items-start mb-6">
            
            <div class="flex gap-12">
                
                <div class="flex flex-col gap-1">
                    <span class="text-gray-500 text-sm">Active Users</span>
                    <span class="text-xl font-bold tracking-wide text-slate-900">12,480</span>
                    <div>
                        <span class="inline-flex items-center px-3 py-0.5 bg-green-100 text-green-700 text-xs font-bold rounded-full">
                            Up
                        </span>
                    </div>
                </div>

                <div class="flex flex-col gap-1">
                    <span class="text-gray-500 text-sm">Requests / Min</span>
                    <span class="text-xl font-bold tracking-wide text-slate-900">1,240</span>
                    <div>
                        <span class="inline-flex items-center px-3 py-0.5 bg-blue-100 text-blue-700 text-xs font-bold rounded-full">
                            Stable
                        </span>
                    </div>
                </div>

                <div class="flex flex-col gap-1">
                    <span class="text-gray-500 text-sm">Error Rate</span>
                    <span class="text-xl font-bold tracking-wide text-slate-900">2.1%</span>
                    <div>
                        <span class="inline-flex items-center px-3 py-0.5 bg-red-100 text-red-700 text-xs font-bold rounded-full">
                            Down
                        </span>
                    </div>
                </div>

            </div>

            <button class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2.5 rounded-lg shadow font-bold text-sm transition-colors">
                Download report
            </button>
        </div>

        <div class="bg-red-50 border-l-4 border-red-500 p-3">
            <p class="text-red-700 text-sm leading-relaxed">
                Scheduled maintenance tonight may briefly affect dashboard updates.
            </p>
        </div>

    </div>

</body>
</html>
